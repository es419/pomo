name: Deploy Pomo to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Generate app icons
        run: |
          sudo apt-get update
          sudo apt-get install -y imagemagick
          # Crop the baked-in white rim, then fill the full icon canvas.
          convert public/icon-v8-source.jpg -gravity center -crop 90%x90%+0+0 +repage -resize 512x512^ -gravity center -extent 512x512 public/pwa-512x512-v9.png
          convert public/pwa-512x512-v9.png -resize 192x192 public/pwa-192x192-v9.png
          convert public/pwa-512x512-v9.png -resize 180x180 public/apple-touch-icon-v9.png

      - name: Build
        run: npm run build

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
